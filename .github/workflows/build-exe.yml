name: Сборка exe

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: pip install -r requirements.txt
      - name: Сборка LibraryApp.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name LibraryApp --icon images\app.ico
          --add-data "images;images" --add-data "data;data" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: LibraryApp-windows
          path: dist/LibraryApp.exe
